<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Schuldbeheer Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-64 bg-white shadow-md flex flex-col">
    <div class="p-6 text-xl font-semibold border-b border-gray-200">
      Schuldbeheer
    </div>
    <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
      <a href="#" class="block px-4 py-2 rounded hover:bg-gray-200 transition">Dashboard</a>
      <a href="#" class="block px-4 py-2 rounded hover:bg-gray-200 transition">Schulden</a>
      <a href="#" class="block px-4 py-2 rounded hover:bg-gray-200 transition">Statistieken</a>
      <a href="#" class="block px-4 py-2 rounded hover:bg-gray-200 transition">Instellingen</a>
    </nav>
  </aside>

  <!-- Main content -->
  <main class="flex-1 flex flex-col overflow-auto">
    <header class="bg-white shadow p-4 flex justify-between items-center">
      <h1 class="text-2xl font-semibold">Dashboard</h1>
      <div class="relative">
        <input id="searchInput" type="text" placeholder="Zoeken..." class="border border-gray-300 rounded px-3 py-1 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
    </header>

    <section class="p-6 flex-1 overflow-auto">
      <!-- Statistics -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
        <div class="bg-white rounded shadow p-4">
          <h2 class="text-lg font-semibold mb-2">Totaal Schulden</h2>
          <p id="totalDebts" class="text-3xl font-bold">0</p>
        </div>
        <div class="bg-white rounded shadow p-4">
          <h2 class="text-lg font-semibold mb-2">Betaalde Schulden</h2>
          <p id="paidDebts" class="text-3xl font-bold text-green-600">0</p>
        </div>
        <div class="bg-white rounded shadow p-4">
          <h2 class="text-lg font-semibold mb-2">Te Late Schulden</h2>
          <p id="overdueDebts" class="text-3xl font-bold text-red-600">0</p>
        </div>
      </div>

      <!-- Debt Management -->
      <div class="bg-white rounded shadow p-6">
        <h2 class="text-xl font-semibold mb-4">Beheer Schulden</h2>
        <form id="debtForm" class="mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
          <input type="hidden" id="debtId" />
          <div>
            <label for="description" class="block mb-1 font-medium">Beschrijving</label>
            <input type="text" id="description" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label for="amount" class="block mb-1 font-medium">Bedrag (€)</label>
            <input type="number" id="amount" min="0" step="0.01" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label for="debtor" class="block mb-1 font-medium">Schuldenaar</label>
            <input type="text" id="debtor" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label for="dueDate" class="block mb-1 font-medium">Vervaldatum</label>
            <input type="date" id="dueDate" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label for="status" class="block mb-1 font-medium">Status</label>
            <select id="status" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="Melding">Melding</option>
              <option value="Betaald">Betaald</option>
              <option value="Te laat">Te laat</option>
            </select>
          </div>
          <div class="flex items-end">
            <button type="submit" id="submitBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Toevoegen</button>
          </div>
        </form>

        <div class="overflow-x-auto">
          <table class="min-w-full bg-white border border-gray-300 rounded">
            <thead>
              <tr class="bg-gray-100 border-b border-gray-300">
                <th class="text-left px-4 py-2">Beschrijving</th>
                <th class="text-left px-4 py-2">Bedrag (€)</th>
                <th class="text-left px-4 py-2">Schuldenaar</th>
                <th class="text-left px-4 py-2">Vervaldatum</th>
                <th class="text-left px-4 py-2">Status</th>
                <th class="text-left px-4 py-2">Acties</th>
              </tr>
            </thead>
            <tbody id="debtsTableBody">
              <!-- Debt rows will be inserted here -->
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const apiBase = 'http://localhost:5000/api/debts';

    let debts = [];
    let editMode = false;

    const debtForm = document.getElementById('debtForm');
    const debtsTableBody = document.getElementById('debtsTableBody');
    const totalDebtsElem = document.getElementById('totalDebts');
    const paidDebtsElem = document.getElementById('paidDebts');
    const overdueDebtsElem = document.getElementById('overdueDebts');
    const searchInput = document.getElementById('searchInput');
    const submitBtn = document.getElementById('submitBtn');
    const debtIdInput = document.getElementById('debtId');

    async function fetchDebts(query = '') {
      const url = query ? `${apiBase}?search=${encodeURIComponent(query)}` : apiBase;
      const res = await fetch(url);
      debts = await res.json();
      renderDebts();
      updateStats();
    }

    function renderDebts() {
      debtsTableBody.innerHTML = '';
      debts.forEach(debt => {
        const tr = document.createElement('tr');
        tr.className = 'border-b border-gray-300 hover:bg-gray-50';
        tr.innerHTML = `
          <td class="px-4 py-2">${debt.description}</td>
          <td class="px-4 py-2">€ ${debt.amount.toFixed(2)}</td>
          <td class="px-4 py-2">${debt.debtor}</td>
          <td class="px-4 py-2">${new Date(debt.dueDate).toLocaleDateString('nl-NL')}</td>
          <td class="px-4 py-2">${debt.status}</td>
          <td class="px-4 py-2 space-x-2">
            <button onclick="editDebt('${debt._id}')" class="text-blue-600 hover:text-blue-800"><i class="fas fa-edit"></i></button>
            <button onclick="deleteDebt('${debt._id}')" class="text-red-600 hover:text-red-800"><i class="fas fa-trash"></i></button>
          </td>
        `;
        debtsTableBody.appendChild(tr);
      });
    }

    function updateStats() {
      totalDebtsElem.textContent = debts.length;
      paidDebtsElem.textContent = debts.filter(d => d.status === 'Betaald').length;
      overdueDebtsElem.textContent = debts.filter(d => d.status === 'Te laat').length;
    }

    debtForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const debtData = {
        description: document.getElementById('description').value.trim(),
        amount: parseFloat(document.getElementById('amount').value),
        debtor: document.getElementById('debtor').value.trim(),
        dueDate: document.getElementById('dueDate').value,
        status: document.getElementById('status').value,
      };

      if (editMode) {
        const id = debtIdInput.value;
        const res = await fetch(`${apiBase}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(debtData),
        });
        if (res.ok) {
          resetForm();
          fetchDebts(searchInput.value);
          alert('Schuld bijgewerkt');
        } else {
          alert('Fout bij bijwerken van schuld');
        }
      } else {
        const res = await fetch(apiBase, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(debtData),
        });
        if (res.ok) {
          resetForm();
          fetchDebts(searchInput.value);
          alert('Schuld toegevoegd');
        } else {
          alert('Fout bij toevoegen van schuld');
        }
      }
    });

    function editDebt(id) {
      const debt = debts.find(d => d._id === id);
      if (!debt) return;
      editMode = true;
      debtIdInput.value = id;
      document.getElementById('description').value = debt.description;
      document.getElementById('amount').value = debt.amount;
      document.getElementById('debtor').value = debt.debtor;
      document.getElementById('dueDate').value = debt.dueDate.split('T')[0];
      document.getElementById('status').value = debt.status;
      submitBtn.textContent = 'Bijwerken';
    }

    async function deleteDebt(id) {
      if (!confirm('Weet je zeker dat je deze schuld wilt verwijderen?')) return;
      const res = await fetch(`${apiBase}/${id}`, { method: 'DELETE' });
      if (res.ok) {
        fetchDebts(searchInput.value);
        alert('Schuld verwijderd');
      } else {
        alert('Fout bij verwijderen van schuld');
      }
    }

    function resetForm() {
      editMode = false;
      debtIdInput.value = '';
      debtForm.reset();
      submitBtn.textContent = 'Toevoegen';
    }

    searchInput.addEventListener('input', () => {
      fetchDebts(searchInput.value);
    });

    // Initial fetch
    fetchDebts();
  </script>
</body>
</html>
